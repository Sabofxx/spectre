# Spectre — pipeline + déploiement GitHub Pages, 100 % dans les quotas gratuits.
# Cron GitHub = UTC, et souvent décalé de quelques minutes (voir README).
name: pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Un seul run à la fois. cancel-in-progress: false — on n'annule JAMAIS un run
# qui est peut-être en train de committer la base.
concurrency:
  group: spectre-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # commit de spectre.db
  pages: write      # déploiement Pages
  id-token: write   # OIDC pour deploy-pages

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # La base ne vit plus dans git : un binaire de ~96 Mo recommitté à chaque
      # run faisait grossir le dépôt sans limite (490 Mo atteints, plafond dur
      # GitHub à 100 Mo par fichier). Elle est portée par la release
      # `db-latest`, téléchargée ici et re-publiée en fin de job.
      # Si la release est absente (premier run, purge), le pipeline repart
      # d'une base vide : dégradé mais jamais cassé.
      - name: Restore database from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download db-latest --repo "$GITHUB_REPOSITORY" \
               --pattern spectre.db --clobber; then
            echo "base restaurée: $(du -h spectre.db | cut -f1)"
          else
            echo "aucune base publiée — démarrage à vide"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ~470 Mo de modèle d'embeddings : sans ce cache, retéléchargé à chaque run.
      # Clé = nom du modèle + version de sentence-transformers (le format de
      # cache peut changer entre versions majeures de la lib).
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-multilingual-e5-small-st-5.6.0

      - name: Install dependencies (torch CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install .

      - name: Run pipeline
        run: |
          python run.py check-classifications
          python run.py pipeline --stats-file /tmp/pipeline-stats.json

      # Un seul fichier compact à committer, pas de -wal/-shm.
      - name: Compact database
        run: python run.py compact

      # Contrainte droits voisins : si un chapô RSS fuit dans le HTML public,
      # on échoue AVANT le déploiement.
      - name: Check no RSS summary leaked into HTML
        run: python run.py check-leaks

      # La base repart vers la release `db-latest` ; seules les archives
      # hebdomadaires (JSON, quelques Ko) restent versionnées dans git.
      # On ne publie que si le run a apporté du contenu : la base change à
      # CHAQUE run (fetch_log), republier ce bruit n'apporte rien.
      # Best-effort : si l'upload échoue, la base repartira au prochain run et
      # le site déployé, construit depuis site/ fraîchement généré, reste correct.
      - name: Publish database to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(python -c "import json;print(json.load(open('/tmp/pipeline-stats.json'))['new_articles'])")
          echo "nouveaux articles: $NEW"
          if [ "$NEW" -gt 0 ]; then
            gh release upload db-latest spectre.db --repo "$GITHUB_REPOSITORY" --clobber
            echo "base publiée: $(du -h spectre.db | cut -f1)"
          else
            echo "Base inchangée, pas de publication."
          fi

      # Les archives hebdomadaires restent dans git : petites, lisibles,
      # et elles font l'historique public du projet.
      - name: Commit weekly archives
        continue-on-error: true
        run: |
          git config user.name "spectre-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/archive)" ]; then
            git add data/archive
            git commit -m "chore: update weekly archives [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            if [ "$(git rev-parse origin/${GITHUB_REF_NAME})" = "$(git rev-parse HEAD~1)" ]; then
              git push
            else
              echo "Le distant a avancé — commit d'archives sauté."
            fi
          else
            echo "Archives inchangées."
          fi

      # Le HTML ne passe jamais par git : artifact Pages direct.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - uses: actions/deploy-pages@v4
        id: deployment
